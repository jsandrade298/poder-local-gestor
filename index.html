<!DOCTYPE html>
<html lang="pt-BR" data-perfil="brasil">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Jorgeus: gestão e inteligência parlamentar para gabinetes legislativos. Demandas, munícipes, agenda, quadros de trabalho e análises em um só lugar." />
    <meta name="author" content="Jorgeus" />

    <!-- Tema salvo (claro/escuro e perfil do gabinete) antes da primeira pintura -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          if (localStorage.getItem("jorgeus-modo") === "escuro") d.classList.add("dark");
          var p = localStorage.getItem("jorgeus-perfil");
          if (p === "jovem") p = "tech"; if (p === "tech" || p === "brasil") d.setAttribute("data-perfil", p);
        } catch (e) { /* sem storage: claro + Brasil! */ }
      })();
    </script>

    <!-- Fontes do manual: Inter (corpo), Plus Jakarta Sans (títulos), Michroma (marca) -->
